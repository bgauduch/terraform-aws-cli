name: dockerhub-description-update

# trigger on any push on master
# only for readme related modifications
on:
  push:
    branches:
      - master
    paths:
      - README.md
      - .github/workflows/dockerhub-description-update.yml

# The description is a republish of the current README, so a superseded run has
# nothing left to contribute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerHubDescription:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Docker Hub Description
        # Dedicated Read/Write/Delete token — registry auth model: docs/publishing.md.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_PAT }}
          repository: bgauduch/terraform-aws-cli
