name: validate

# Thin CI caller of the verification oracle (ADR-0016): it adds no logic of
# its own, so a green run here means the same locally. Secret-free (ADR-0013).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run the fast validation oracle
        run: ./scripts/validate.sh --fast
