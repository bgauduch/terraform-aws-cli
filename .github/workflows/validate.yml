name: validate

# Thin CI caller of the verification oracle (ADR-0016): it adds no logic of
# its own, so a green run here means the same locally.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the fast validation oracle
        run: ./scripts/validate.sh --fast
