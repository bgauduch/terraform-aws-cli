name: release-please

# Single release workflow (ADR-0002, ADR-0018).
#
# Sole publisher of latest, vX.Y, vX.Y.Z and the pinned combination tags; the
# master-push workflow owns edge and never writes latest (ADR-0018).
#
# On every push to master, release-please maintains a "Release PR" that bumps
# the project version (from Conventional Commits) and updates CHANGELOG.md.
# Merging that Release PR creates the GitHub release + the project version tag
# (vX.Y.Z); the build/push jobs below are gated on that release and publish the
# images. No separate release.yml and no Personal Access Token are needed: the
# build is wired in-workflow on the `release_created` output, so the default
# GITHUB_TOKEN (plus the existing DockerHub secrets) is enough. A final
# verify_release job calls the verification oracle (ADR-0016) to assert what the
# registry serves for the release, and opens an issue when the publication is
# incomplete.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  issues: write

# Queues instead of cancelling, unlike the other publishers: a run interrupted
# between the GitHub release and the image pushes half-publishes (ADR-0018).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  load_supported_versions:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Save supported versions as output
        id: set-matrix
        # the oracle renders the matrix (ADR-0016); the PR gate reads the same
        # source with --with-arch
        run: |
          VERSIONS=$(./scripts/validate.sh --matrix)
          echo "matrix=${VERSIONS}" >> $GITHUB_OUTPUT

  build_push_release:
    needs: [release-please, load_supported_versions]
    runs-on: ubuntu-22.04

    strategy:
      # a failed combo must not cancel the independent sibling builds
      fail-fast: false
      matrix: ${{ fromJSON(needs.load_supported_versions.outputs.matrix) }}

    env:
      ORGANIZATION: "bgauduch"
      IMAGE_NAME: "terraform-aws-cli"
      RELEASE_VERSION: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Compose the tags this combination publishes
        # every combination pushes its pinned tag; the latest combination also
        # carries the release, vX.Y and latest aliases (ADR-0018). The oracle
        # owns the semver sort (ADR-0016).
        run: |
          LATEST_TF=$(./scripts/validate.sh --latest tf_versions)
          LATEST_AWS=$(./scripts/validate.sh --latest awscli_versions)
          MINOR_TAG=${RELEASE_VERSION%.*}
          TAGS="${ORGANIZATION}/${IMAGE_NAME}:${RELEASE_VERSION}_tf-${{ matrix.tf_versions }}_aws-${{ matrix.awscli_versions }}"
          if [ "${{ matrix.tf_versions }}" = "${LATEST_TF}" ] && [ "${{ matrix.awscli_versions }}" = "${LATEST_AWS}" ]; then
            TAGS="${TAGS},${ORGANIZATION}/${IMAGE_NAME}:${RELEASE_VERSION},${ORGANIZATION}/${IMAGE_NAME}:${MINOR_TAG},${ORGANIZATION}/${IMAGE_NAME}:latest"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_ENV

      - name: Login to Docker Hub registry
        run: echo '${{ secrets.DOCKERHUB_PAT }}' | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            TERRAFORM_VERSION=${{ matrix.tf_versions }}
            AWS_CLI_VERSION=${{ matrix.awscli_versions }}
          tags: ${{ env.TAGS }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify_release:
    needs: [release-please, build_push_release]
    # runs on partial matrix failure too, to report what is missing or stale
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-22.04

    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Assert the release is fully published
        run: ./scripts/validate.sh --published "${RELEASE_VERSION}"

      - name: Open an issue when the publication is incomplete
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Release ${RELEASE_VERSION}: publication incomplete" \
            --body "verify_release failed: expected image tags are missing or stale on the registry. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
